name: Production Sync (dev -> main)

on:
  push:
    branches:
      - dev
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Perform a dry-run without pushing to main'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: production-sync
  cancel-in-progress: true

jobs:
  sync:
    name: Sanitize & Sync Production Branch
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository (Full History)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Verify dev Branch Build Health
        run: npm run build

      - name: Configure Git Identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Prepare Clean Production Tree
        run: |
          # Fetch all remote branches
          git fetch origin main:main || git checkout -b main

          # Ensure main branch is checked out
          git checkout main

          # Reset main to match the latest dev branch state
          git reset --hard dev

          # Read .prodignore and remove excluded files/directories
          if [ -f .prodignore ]; then
            echo "Applying .prodignore exclusion rules..."
            while IFS= read -r pattern || [ -n "$pattern" ]; do
              # Trim leading/trailing whitespace
              trimmed=$(echo "$pattern" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')
              
              # Skip empty lines and comments
              if [ -z "$trimmed" ] || [[ "$trimmed" =~ ^# ]]; then
                continue
              fi

              echo "Pruning pattern from production: $trimmed"
              # Remove matched files or directories using git rm if tracked
              git rm -rf --ignore-unmatch "$trimmed" 2>/dev/null || rm -rf "$trimmed"
            done < .prodignore
          fi

          # Stage any unstaged file removals
          git add -A

      - name: Verify Production Tree Build Integrity
        run: |
          # Verify the clean production tree builds with 0 errors
          rm -rf .next
          npm run build

      - name: Commit & Push to main
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          # Check if there are changes to commit on main
          if git diff-index --quiet HEAD --; then
            echo "Production branch is already in sync with dev."
          else
            DEV_COMMIT=$(git rev-parse --short dev)
            git commit -m "chore(prod): sync core engine from dev ($DEV_COMMIT) [skip ci]"
            git push origin main
            echo "Successfully deployed sanitized production tree to main."
          fi
